<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f2f4f8;
            color: #333;
        }

        .cards-page {
            padding: 40px 20px;
        }

        .cards-page h3 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 24px;
            color: #111;
        }

        .product-cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
        }

        .product-card {
            width: 280px;
            background: whitesmoke;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background: linear-gradient(135deg, #4f6cff, #8e5cff);
            color: #fff;
        }

        .product-details {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .product-details h2 {
            font-size: 1.2rem;
            color: #222;
        }

        .product-details p {
            color: #666;
            line-height: 1.5;
            flex: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .price {
            font-weight: 700;
            color: #2563eb;
        }

        button {
            border: none;
            background: #2563eb;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {
            .product-card {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>
    <div class="cards-page">
        <h3>Product cards</h3>

        <div class="product-cards">
            <div class="product-card">
                <div class="product-image">📦</div>
                <div class="product-details">
                    <h2>Nike Shoes</h2>
                    <p>Modern design with premium quality materials.</p>
                    <div class="card-footer">
                        <span class="price">₹99.99</span>
                        <button>Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">🛍️</div>
                <div class="product-details">
                    <h2>Adidas Jacket</h2>
                    <p>Stylish and lightweight for everyday use.</p>
                    <div class="card-footer">
                        <span class="price">₹79.50</span>
                        <button>Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">💡</div>
                <div class="product-details">
                    <h2>Apple Watch</h2>
                    <p>High performance with elegant finishing details.</p>
                    <div class="card-footer">
                        <span class="price">₹129.99</span>
                        <button>Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
