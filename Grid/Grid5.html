<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --primary-color:black;
            --secondary-color:yellow;
            --text-size:30px;
            --secondary-text-size:10px;
        }
        .container{
            display: grid;
            outline: 1px solid black;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            height: 500px;
            width: 500px;
        }
        .parent{
            display: grid;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            /* font-size: 30px; */
            grid-column: 1/4;
            grid-row: 1/4;
            background-color: plum;  
        }
        .child{
            background-color: var(--secondary-color);
            grid-column: 1/3;
            grid-row: 1/3;
            
            display: grid;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
        }
        .pota{
            background-color: var(--primary-color);
            grid-column: 1/2;
            grid-row: 1/2;
            font-size:calc(var(--text-size) + var(--secondary-text-size))
        }
        /* #box1{
            grid-column:1/3;
            background-color: bisque;
            grid-row:1/3;
            z-index: 1;
        }
        #box6{
            background-color: aliceblue;
            grid-column:2/3;
            grid-row:1/2;
            z-index:2 ;
        } */
    </style>
</head>
<body>
    <div class="container">
        <!-- <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div> -->

        <div class="parent">
            <div class="child">
                <div class="pota">1</div>
            </div>
        </div>
    </div>
</body>
</html>
