<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        .container{
            outline: 3px solid black;
            padding: 38px;
            display: grid;
            height: 90vh;
            grid-template-columns: repeat(3,1fr);
            grid-template-areas:
            "Header Header Header"
            "Sidebar Main Main"
            "Sidebar Main Main"
            "Sidebar Card1 Card2"
            "Footer Footer Footer";
            gap: 5px;
            margin: 10px;
        }
        .box{
            min-height: auto;
            border: 2px solid black;
            box-shadow: 10px 5px 5px rgba(0, 0,0 , 0.2);
            border-radius: 5px;
            background-color: lemonchiffon;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" style="grid-area: Header;">Header</div>
        <div class="box" style="grid-area: Sidebar;">Sidebar</div>
        <div class="box" style="grid-area: Main;">Main Content</div>
        <div class="box" style="grid-area: Card1;">Card1</div>
        <div class="box" style="grid-area: Card2;">Card2</div>
        <div class="box" style="grid-area: Footer;">Footer</div>
    </div>
</body>
</html>
