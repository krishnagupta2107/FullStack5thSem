<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Mustache</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #f8f1e7;
        }

        .mustache {
            position: relative;
            width: 460px;
            height: 150px;
        }

        /* LEFT HALF */
        .mustache::before {
            content: "";
            position: absolute;

            width: 55%;
            height: 85%;

            left: -2%;
            top: 10px;

            background:
                linear-gradient(
                    180deg,
                    #292423 0%,
                    #0d0b0b 80%
                );

            /* Gives the moustache its curved shape */
            border-radius:
                75% 25% 55% 65% /
                75% 35% 65% 55%;

            transform: rotate(-12deg);
            transform-origin: 100% 100%;

            box-shadow:
                0 8px 0 rgba(0, 0, 0, 0.25),
                inset 8px 5px 10px rgba(255,255,255,0.035);

            z-index: 2;
        }

        /* RIGHT HALF */
        .mustache::after {
            content: "";
            position: absolute;

            width: 55%;
            height: 85%;

            right: -2%;
            top: 10px;

            background:
                linear-gradient(
                    180deg,
                    #292423 0%,
                    #0d0b0b 80%
                );

            border-radius:
                25% 75% 65% 55% /
                35% 75% 55% 65%;

            transform: rotate(12deg);
            transform-origin: 0% 100%;

            box-shadow:
                0 8px 0 rgba(0, 0, 0, 0.25),
                inset -8px 5px 10px rgba(255,255,255,0.035);

            z-index: 2;
        }

        @media (max-width: 480px) {
            .mustache {
                width: 300px;
                height: 100px;
            }
        }
    </style>
</head>

<body>

    <div class="mustache"></div>

</body>
</html>
