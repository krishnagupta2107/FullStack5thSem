<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashBoard</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            outline: 3px solid black;
            height: 90vh;
        }

        .container>div {
            color: white;
        }

        #sidebar {
            background-color: black;
            height: 100%;
            flex-basis: 20%;
            box-sizing: border-box;
            padding-top: 10px;
        }

        #sidebar ul {
            gap: 10px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #sidebar ul li {
            list-style: none;
            padding: 0 20px;
            text-align: center;
            font-weight: bold;
            margin: 10%;
        }

        a {
            text-decoration: none;
            color: White;
            transition: color 0.3s ease;
            font-size: 20px;
        }

        a:hover {
            color: blue;
        }

        /* Right-side content area */
        #main {
            flex-basis: 80%;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            min-height: 0;
        }

        /* top header area */
        #box2 {
            background-color: whitesmoke;
            border-bottom: 1px solid black;
            padding: 8px 12px;
            color: black;
        }

        #box2 ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #box2 ul li {
            font-weight: bold;
            font-size: 18px;
        }

        /* cards area below the header: responsive grid */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            padding: 16px;
            align-items: stretch;
            background: transparent;
            overflow: auto;
        }

        .card {
            background: red;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            padding: 12px;
            height: 200px;
            box-sizing: border-box;
        }

        #recent-orders h3 {
            margin-bottom: 15px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table thead {
            background-color: #f0f0f0;
        }

        table th {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
            font-weight: bold;
            color: #333;
        }

        table td {
            padding: 10px;
            border: 1px solid #ddd;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="sidebar">
            <ul>
                <li style="color: white; font-size: 45px;">DashBoard</li>
                <hr>
                <br>
                <li><a href="/DashBoardFlex.html">DashBoard</a></li>
                <li><a href="/Users.html">Users</a></li>
                <li><a href="/Product-Cards.html">Products</a></li>
                <li><a href="/Orders.html">Order</a></li>
                <li><a href="/Settings.html">Settings</a></li>
            </ul>
        </div>
        <div id="main">
            <div id="box2">
                <ul>
                    <li>DashBoard Layout</li>
                </ul>
            </div>

            <div class="cards">
                <div class="card">Box 1</div>
                <div class="card">Box 2</div>
                <div class="card">Box 3</div>
                <div class="card">Box 4</div>
            </div>
            <div id="recent-orders">
                <h3>Recent Orders</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Order Date</th>
                            <th>Name</th>
                            <th>Quantity</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>ORD001</td>
                            <td>2024-01-15</td>
                            <td>John Smith</td>
                            <td>5</td>
                        </tr>
                        <tr>
                            <td>ORD002</td>
                            <td>2024-01-14</td>
                            <td>Jane Doe</td>
                            <td>3</td>
                        </tr>
                        <tr>
                            <td>ORD003</td>
                            <td>2024-01-13</td>
                            <td>Mike Johnson</td>
                            <td>7</td>
                        </tr>
                        <tr>
                            <td>ORD004</td>
                            <td>2024-01-12</td>
                            <td>Sarah Williams</td>
                            <td>2</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
