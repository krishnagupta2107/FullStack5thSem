<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f0f4f8;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
            justify-content: center;
            margin: 25px auto;
        }
        .cell {
            width: 100px;
            height: 100px;
            background: white;
            border: 2px solid #2563eb;
            border-radius: 12px;
            font-size: 40px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .active {
            background: #bbf7d0;
        }
        button {
            padding: 10px 22px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>🔨 Whack-a-Mole</h1>
    <h3>Score: <span id="score">0</span></h3>
    <h3>Time: <span id="time">30</span>s</h3>
    <div class="grid" id="grid"></div>
    <button id="startBtn">Start Game</button>
    <p id="message">Press Start to play!</p>
    <script src="Task3.js"></script>
</body>
</html>
