<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ratings</title>
</head>
<body>
    <main>
        <h1>Movie Ratings</h1>
        <form id="movie-form">
            <label for="movie-name">Movie name</label>
            <input type="text" id="movie-name" required>

            <label for="movie-rating">Rating</label>
            <input type="number" id="movie-rating" min="0" max="10" step="0.1" required>

            <button type="submit" id="save-button">Add movie</button>
            <button type="button" id="cancel-button" hidden>Cancel</button>
        </form>

        <ul id="movie-list"></ul>
    </main>

    <script src="1.js"></script>
</body>
</html>
