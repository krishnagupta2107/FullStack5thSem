<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            background: #f1f5f9;
        }
        #reactionBox {
            width: 300px;
            height: 200px;
            margin: 30px auto;
            background: #ef4444;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            user-select: none;
        }
        button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Reaction Timer</h1>
    <div id="reactionBox">Click Start to Play</div>
    <button id="startBtn">Start Game</button>
    <h3 id="result">Your time: -- ms</h3>
    <h3 id="bestTime">Best time: -- ms</h3>
    <p id="message"></p>
    <script src="Task4.js"></script>
</body>
</html>
