<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        .container{
            display: flex;
            flex-wrap: wrap;        /*Responsive*/
            /* flex-direction: column-reverse; */
            height: 97vh;
            align-items: center;          /*To make div center 3 card problem*/
            justify-content: center;            /*for making a single card in center by removing flex:1;*/
            background-color: beige;
        }
        #box1{
            background-color: aliceblue;
            margin: 1%;
            color: black;
            width: 300px;
            height: 200px;
            min-width: 200px;
            box-shadow:3px 0 10px black;
            border-radius: 10px;
            border: 2px solid black;
        }
        form{
            text-align: center;
            text-shadow: 0 0 3px pink;
        }
        h1{
            color:black;
            text-align: center;
            text-shadow: 0 0 10px purple ;
        }
        button{
            box-shadow: 5px 0 10px rgba(0, 0, 0, 0.5);
            background-color: grey;
            height: 25px;
            width: 50px;
        }
        input{
            box-shadow: 5px 0 10px rgba(0, 0, 0, 0.5);
        }
        /* #box2{
            flex: 1;
            background-color: black;
            margin: 1%;
            color: white;
            height: 400px;
            min-width: 200px;
        } */
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">
            <h1>Login</h1>
            <form action="">
                <label for="username">Username: </label>
                <input type="email" placeholder="Enter your email" id="username" required>
                <br>
                <br>
                <label for="password">Password: </label>
                <input type="password" id="password" placeholder="Enter your password" required>
                <br>
                <br>
                <button>Submit</button>
            </form>
            
        </div>
        <!-- <div id="box2">2</div>
        <div id="box3">3</div> -->
        <!-- <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div> -->
    </div>
</body>
</html>
