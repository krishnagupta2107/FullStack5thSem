<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding vs Margin</title>

<body>

    <img src="SOLO.jpg" alt="SOLO" style="margin:.065%">
