<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding vs Margin</title>
</head>
<body>
    <img src="SOLO.jpg" alt="SOLO" style="padding:3%; background-color: black; width:50%;height:50%">
    <img src="SOLO.jpg" alt="SOLO" style="margin:3%">
</body>
</html>
