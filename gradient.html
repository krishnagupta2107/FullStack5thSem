<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background-color:#2d2d2d;
        }
        .gradient-box {
            width: 300px;
            height: 300px;
            border-radius: 60px;
            padding: 15px;
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8a2be2);
            box-shadow: 7px 4px 8px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            position: relative;
        }
        .gradient-box::before {
            content: "";
            position: absolute;
            inset: 15px;
            border-radius: 45px;
            background: #2d2d2d;
        }
        h1
        {
            color: white;
            text-align: center;
            margin-top: 60px;
            font-size: 120px;
            background: linear-gradient(to right, #9d1db1, #6b4873);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        position: absolute;
        text-shadow: 0px 0px 10px rgba(190, 94, 34, 0.5);
        }
    </style>
</head>
<body>
    <div class="gradient-box"></div>
    <h1>BOX</h1>
</body>
</html>
